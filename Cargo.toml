[package]
name = "facaded_rnn"
version = "0.2.0"
edition = "2021"
authors = ["Matthew Abbott"]
license = "MIT"
description = "Facaded GPU-accelerated RNN implementation supporting CUDA, OpenCL, and CPU backends"

[features]
default = ["cuda"]
cuda = ["dep:cudarc"]
opencl = ["dep:opencl3"]

[dependencies]
cudarc = { version = "0.12", features = ["driver", "nvrtc", "cuda-version-from-build-system"], optional = true }
opencl3 = { version = "0.9", optional = true }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }

[[bin]]
name = "facaded_rnn"
path = "src/main.rs"

[lib]
name = "facaded_rnn"
path = "src/lib.rs"
crate-type = ["lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
