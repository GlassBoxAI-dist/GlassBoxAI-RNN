[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "facaded_rnn"
version = "0.2.0"
description = "Python bindings for facaded_rnn GPU-accelerated RNN library"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
