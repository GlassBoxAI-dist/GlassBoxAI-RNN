[package]
name = "facaded_rnn_python"
version = "0.2.0"
edition = "2021"
authors = ["Matthew Abbott"]
license = "MIT"
description = "Python bindings for facaded_rnn GPU-accelerated RNN library"

[lib]
name = "facaded_rnn_python"
crate-type = ["cdylib"]

[features]
default = []
cuda = ["facaded_rnn/cuda"]
opencl = ["facaded_rnn/opencl"]

[dependencies]
facaded_rnn = { path = "..", default-features = false }
pyo3 = { version = "0.22", features = ["extension-module"] }
